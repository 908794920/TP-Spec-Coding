schema: tp-spec.wiki-snapshot/v1
required:
  - repo_id
  - snapshot_id
  - files
file_fields:
  - size
  - mtime_ns
  - content_hash
  - normalized_hash
  - encoding
  - decode_status
commit_rule: "Only current verification PASS (+ semantic audit PASS when required) may advance baseline."

raw_sha_rule: "FILESYSTEM hashes every discovered source on each scan; GIT_REF hashes changed blobs from a pinned commit diff. Size/mtime alone never prove unchanged content."
optional_fields:
  source:
    source_mode: GIT_REF or FILESYSTEM
    stable_ref: explicit refs/remotes/<remote>/<branch> for new GIT_REF runs; historical values retained; empty for FILESYSTEM
    commit: immutable full commit SHA for GIT_REF; empty for FILESYSTEM
    repo_prefix: repository-relative subtree prefix; no machine absolute path
  source_policy_digest: source selection and fingerprint rules
  maintenance_digest: merged maintenance config and relevant implementation/rules
  maintenance_components: "format=1; configs maps source/snapshot/quality/coverage to canonical JSON SHA256; rules maps every maintenance rule path to its byte SHA256"
  scan_mode: GIT_INVENTORY or COMMIT_DIFF or FILESYSTEM_HASH
  completion:
    status: SUCCESS or UNVERIFIED
    committed_at: successful baseline replacement time
    change_set_id: verified run identity
    subject_digest: durable Wiki subject
    verification: retained verification result/time/subject/audit requirement
    audit: retained audit result/time/source/subject/documents/topology, summary, audit_scope, deterministic audit_plan and its digest, supplied representative claims, and evidence limitations
    semantic_reuse: "prior baseline identity/completion, original audit or null with LEGACY_L4_NOT_RECORDED limitations, exact policy-review proof and narrowly normalized content identity; never a new L4 PASS"
    affected_documents: Wiki pages selected by the final plan
optional_git_file_fields: [git_blob, git_mode]
identity_rule: "snapshot_id remains the content identity, not a commit SHA; legacy source identity must be explicitly initialized, never inferred from the worktree."
audit_evidence_rule: "Claim associations are optional and do not prove every sentence was reviewed. Missing old claim evidence remains NOT_RECORDED with historical limitations; it is never reconstructed."
