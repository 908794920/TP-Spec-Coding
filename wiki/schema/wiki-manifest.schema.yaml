schema: tp-spec.wiki-manifest/v1
required:
- workspace_id
- repo_id
- repo_root
- documents
document_types:
- content-doc
- concept-card
- module-index
dependency_roles:
- primary
- context
- reference
machine_owned_fields:
- source
- generated_at
- provenance.manifest_refresh
- source_change_set_id
- candidate_snapshot_id
- documents[].content_hash
- documents[].citations
- documents[].dependencies[].content_hash
- documents[].dependencies[].normalized_hash
notes:
- branch is not emitted by deterministic refresh; Git branch names are not part of snapshot truth and stale copied values are removed.
- source holds source_mode, stable_ref, commit and repo_prefix; GIT_REF citations bind that full commit, while FILESYSTEM retains hash/stability checks without Git.
- Legacy source absence requires explicit initialization for formal Git maintenance; no dirty-worktree commit is fabricated.
- A single manifest-level AI generator is not authoritative after incremental maintenance; semantic authorship is mixed/per-document
  and may be not-recorded.
