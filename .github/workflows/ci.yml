name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/check_version_consistency.py
      - run: python scripts/update_role_catalog.py --verify
      - run: python scripts/check_portability.py
      - run: python scripts/update_manifest.py --verify-release

  windows-full:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Full Windows gate
        shell: pwsh
        run: pwsh -File scripts/ci/Test-TpSpecBase.ps1 -Mode Full
