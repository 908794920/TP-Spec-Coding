name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # The base has no declared third-party pytest plugins.  Keep CI deterministic
  # and do not let machine-installed entry points change test semantics.
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  python-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Fast pytest gate
        run: python -m pytest -q -m "smoke or ((unit or contract) and not slow)"
      - run: python scripts/check_version_consistency.py
      - run: python scripts/update_role_catalog.py --verify
      - run: python scripts/check_document_navigation.py
      - run: python scripts/check_portability.py
      - run: python scripts/update_manifest.py --verify-release

  python-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Parallel-safe integration gate
        run: python -m pytest -q -m "integration and not slow and not serial"
      - name: Serial integration gate when registered
        shell: bash
        run: |
          set +e
          python -m pytest -q -m "integration and not slow and serial"
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "No serial integration tests registered."
            exit 0
          fi
          exit "$code"

  python-release:
    if: github.event_name == 'push'
    needs: [python-fast, python-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Full release pytest regression
        run: python -m pytest -q --durations=50

  windows-pr:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Fast pytest gate
        shell: pwsh
        run: python -m pytest -q -m 'smoke or ((unit or contract) and not slow)'
      - name: Static Windows gate
        shell: pwsh
        run: pwsh -File scripts/ci/Test-TpSpecBase.ps1 -Mode Static

  windows-full:
    if: github.event_name == 'push'
    needs: [python-fast, python-integration]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Full Windows gate
        shell: pwsh
        run: pwsh -File scripts/ci/Test-TpSpecBase.ps1 -Mode Full
