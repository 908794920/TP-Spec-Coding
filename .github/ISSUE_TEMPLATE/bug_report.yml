name: Bug 报告
description: 报告可重复的错误、回归或兼容问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先移除凭据、真实个人信息、生产数据和私有 Runtime/Wiki/Knowledge 内容。
  - type: input
    id: version
    attributes:
      label: TP-Spec-Coding 版本
      placeholder: "例如 5.2.5 / commit hash"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows
        - Linux
        - macOS
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题现象
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志 / 验证信息
      description: 请脱敏后粘贴关键输出。安全漏洞请按 SECURITY.md 走私密渠道。
