name: 功能建议
description: 提议新的 Agent、Skill、Runtime 能力或使用体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 优先描述真实场景，而不是先给实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的使用方式
      description: 最好用一段实际调用流程或输入/输出来说明。
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 对现有契约的影响
      description: 是否会影响 role ID、Runtime/schema、机器配置、跨机器迁移或现有 Agent/Skill 边界？
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
