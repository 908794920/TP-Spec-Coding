[pytest]
minversion = 8.0
addopts = --strict-markers
markers =
    unit: pure/unit-level behavior without cross-module runtime composition
    contract: public CLI/file/schema/skill compatibility contract
    integration: SQLite/Git/filesystem/subprocess/cross-module integration
    smoke: minimal critical startup or contract signal
    slow: measured high-cost test or test file
    serial: test must not run concurrently with parallel-safe tests
    base: base/config/core domain
    runtime: runtime/task-state domain
    workflow: orchestration/workflow domain
    cards: card snapshot/render/display domain
    knowledge: knowledge domain
    wiki: wiki domain
    autonomy: autonomy domain
    roles: role catalog/resolver domain
    migration: migration/backward-compat domain
    release: release/package/purity domain
    portability: cross-platform/Windows/path domain
