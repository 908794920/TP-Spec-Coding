<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>TP-Spec 工作台</title>
    <script>
      // 首次绘制前应用主题，颜色仍由 tokens.css 统一维护。
      (() => {
        let preference = 'system';
        try { preference = localStorage.getItem('tp-spec.workbench.theme') || 'system'; } catch {}
        const mode = preference === 'light' || preference === 'dark' ? preference : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
