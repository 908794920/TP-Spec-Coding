# AI Knowledge Rule Definition — V5.3.0 Record-first
#
# Purpose:
#   Define when long-lived Knowledge is worth capturing and which component owns
#   retrieval/canonical maintenance.  Physical paths and retrieval implementation
#   are owned by governance/content-systems.yaml, not this rule file.
#
# Compatibility version remains 2.1.0 for active V5.3.0 tasks; semantics are
# additive/Record-first；Knowledge 仅在存在可信 task-scoped Request 时成为条件性完成门禁。
version: "2.1.0"

knowledge:
  purpose:
    description: "保存跨 Task 长期有效、可复用、能提高未来判断质量的业务/技术/运维知识"
    authority:
      truth: "Canonical Markdown + registered source/evidence"
      retrieval_projection: "configured projection DB（可删除重建，不是事实源）"
      path_resolver: "governance/content-systems.yaml + project override"
    retrieval:
      entry: "tp-spec knowledge search"
      strategy: "canonical-first-fts5"
      source_fallback: true
      vector: "retired-compatible；存在旧表不代表活动能力"
  storage:
    rule: "所有 physical root / registry / projection 路径由 Content Systems Resolver 解析；本规则不持有绝对路径"
    canonical:
      projects: "10-projects/{project-id}"
      shared: "20-shared"
      evidence: "项目 90-sources/ 或 registered external/task/code evidence"
    generated:
      rule: "SQLite FTS/link/graph 等 projection 可重建，不作为 canonical 写入目标"

should_save:
  architecture_decision:
    enabled: true
    examples: ["关键架构边界", "技术选型原因", "长期禁止项"]
  business_rule:
    enabled: true
    examples: ["稳定业务流程", "状态/权限规则", "特殊业务约束"]
  data_and_interface:
    enabled: true
    examples: ["核心数据语义", "接口契约", "跨系统约束"]
  production_issue:
    enabled: true
    examples: ["已验证根因", "长期防复发措施", "高复用排障经验"]
  operating_knowledge:
    enabled: true
    examples: ["稳定运维规则", "恢复/回滚经验", "长期工具约束"]

should_not_save:
  examples:
  - "一次性沟通过程或聊天记录"
  - "普通代码修改流水账"
  - "临时调试日志/未验证 workaround"
  - "无复用价值的 CRUD/样式改动"
  - "仅为了提高文档数量/覆盖率而复制 Source"
  - "没有 evidence 的模型推断"

responsibility:
  tp-product-manager:
    role: "按需知识消费者"
    responsibilities:
    - "存在业务/历史知识缺口时优先使用标准 Knowledge Retrieval，而不是全库扫描历史资料"
    - "Knowledge 与当前需求/源码冲突时标注冲突，不静默采用"
  tp-software-architect:
    role: "知识消费者与长期价值信号提供者"
    responsibilities:
    - "设计/风险判断需要历史项目事实时优先 tp-spec knowledge search，并按需回 source/evidence"
    - "不得直接把检索命中当成当前源码事实；代码事实仍回 Source/Wiki 核验"
    - "可以标记候选长期知识价值，但不直接维护 canonical Knowledge"
  tp-integration-engineer:
    role: "交付事实提供者"
    responsibilities:
    - "只形成 verified delivery facts / residual risk / integration result，不裁决长期 Knowledge"
    - "仅在可信长期知识信号存在时由 Runtime 写 KNOWLEDGE_CONVERGENCE_REQUEST；Integration 不写最终 Result"
  tp-knowledge:
    role: "Knowledge Content System 权威维护 Agent"
    responsibilities:
    - "消费可信 KNOWLEDGE_CONVERGENCE_REQUEST，执行 current project + shared targeted search"
    - "只有 tp-knowledge 写 CREATED/UPDATED/DUPLICATE/NO_DURABLE_INSIGHT Result"
    - "负责 source ingest/registry、canonical normalization、audit/projection 与长期治理；task-scoped 模式不启动这些全量维护动作"

workflow:
  retrieval:
    trigger: "需求/设计/排障存在可从长期知识确认的具体缺口"
    steps:
    - "resolve Content Systems"
    - "tp-spec knowledge search（知道 project-id 时按问题范围使用 project filter）"
    - "canonical 命中优先；需要证明时下钻 source/evidence"
    - "涉及当前代码实现时再用 Wiki 缩小范围并回 Source Code 核验"
  task_capture:
    trigger: "可信 Verification/Review/Delivery 事实含长期知识信号，或 human_owner 明确要求"
    states: [NOT_REQUIRED, NOT_RUN, CREATED, UPDATED, DUPLICATE, NO_DURABLE_INSIGHT]
    steps:
    - "Delivery READY 在有信号时同事务写 KNOWLEDGE_CONVERGENCE_REQUEST；无信号不创建 Request，投影 NOT_REQUIRED"
    - "tp-software-lifecycle 对未完成 Request 返回 dispatch_effect(tp-knowledge)，不新增 lifecycle stage"
    - "tp-knowledge 只做 current project + registered shared targeted search，并保存 query receipt / Task source / reason_code"
    - "CREATED/UPDATED 绑定 exact canonical，并通过局部 lint + 单条增量 index；DUPLICATE 必须命中已有 canonical；NO_DURABLE_INSIGHT 也必须证明已检索"
    - "Request 存在但无可信 Result 时投影 NOT_RUN，不得写 NO_CHANGE 伪装已执行"
    completion_gate: conditional
    completion_rule: "没有 Request 时不增加门禁；存在当前 Request 时必须有同 Request/Change Set 的可信 Result"
  external_ingest:
    protocol: "automation/knowledge/ingest-batch.md"
    invariant: "Registered Source Accountability = 100%；不要求每个 Source 生成 canonical"
  scheduled_maintenance:
    protocol: "automation/knowledge/daily-maintenance.md"
    executor: "unattended conversational model"
    interaction: "AskUserQuestion forbidden；歧义/破坏性操作 fail-closed"

quality:
  requirements:
  - "canonical 必须有 durable source_refs/evidence_refs"
  - "事实、历史观察、推断、待确认项必须区分"
  - "强断言必须由真正 enforcement/evidence 层支持"
  - "update/merge 优先于重复 create"
  - "source accountability、traceability、projection freshness 分开报告"
  - "检索策略变化必须先跑当前 Golden Query eval"
  gates:
    L1: "schema/id/project/kind/relation/path integrity"
    L2: "evidence/source traceability"
    L3: "content/projection/retrieval deterministic quality"
    L4: "targeted conversational semantic audit"

editor_experience:
  role: "人类浏览/编辑体验；不是 Runtime authority"
  requirements:
  - "保留可读目录和链接"
  - "不让特定编辑器/Junction 成为 Knowledge Runtime 前提"
  - "generated projection 与临时施工资产不得冒充 canonical"

principles:
  knowledge_is_asset:
    enabled: true
    description: "Knowledge 是跨任务长期资产，不属于单次 Task"
  task_record_not_equal_knowledge:
    enabled: true
    description: "Task 保存发生过什么；Knowledge 只保存长期可复用内容"
  source_accountability_not_coverage:
    enabled: true
    description: "每个 registered Source 必须有 disposition，但 duplicate/source_only/excluded 等不应被强制 canonicalized"
  projection_not_truth:
    enabled: true
    description: "FTS/link/graph DB 是可重建检索投影，不是 Knowledge truth"
  low_overhead:
    enabled: true
    description: "优先低成本、可解释、可维护能力；不为边际收益恢复复杂检索依赖"
