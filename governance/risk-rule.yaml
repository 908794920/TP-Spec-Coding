# AI Risk Rule Definition
# AI研发风险判断规则
#
# 用途：
# 定义需求风险等级判断标准。
#
# 核心原则：
# 1. 风险由影响范围决定，而不是代码量决定。
# 2. 小修改可能产生高风险。
# 3. 任何不确定风险必须升级判断。
version: "2.0.0"
risk:
  # ==================================================
  # 风险等级定义
  # ==================================================
  levels:
    L0:
      name: "极低风险"
      description: "不会影响业务逻辑、数据和系统行为的调整"
      characteristics:
        - "仅视觉展示变化"
        - "仅文案调整"
        - "不改变用户操作流程"
        - "不改变接口行为"
        - "不改变数据结构"
    L1:
      name: "低风险"
      description: "影响范围明确，业务风险较低的调整"
      characteristics:
        - "单模块内部修改"
        - "新增非核心查询条件"
        - "简单页面字段展示"
        - "非关键代码优化"
    L2:
      name: "普通风险"
      description: "需要技术分析和完整验证的研发任务"
      characteristics:
        - "新增业务功能"
        - "修改业务逻辑"
        - "新增接口"
        - "数据库结构调整"
        - "影响多个模块"
    L3:
      name: "高风险"
      description: "可能影响核心业务、安全、数据一致性的变更"
      characteristics:
        - "核心流程调整"
        - "权限调整"
        - "数据迁移"
        - "生产关键配置变化"
        - "系统架构变化"
# ==================================================
# 风险判断维度
# ==================================================
dimensions:
  # ------------------------------
  # 业务影响
  # ------------------------------
  business:
    description: "业务流程和用户影响"
    high_risk:
      - "修改核心业务流程"
      - "修改审批流程"
      - "修改订单状态流转"
      - "修改权限规则"
      - "修改计费规则"
      - "修改用户核心操作流程"
    medium_risk:
      - "新增业务功能"
      - "调整业务规则"
      - "新增业务状态"
    low_risk:
      - "修改展示文案"
      - "调整页面布局"
  # ------------------------------
  # 数据影响
  # ------------------------------
  data:
    description: "数据结构和数据安全影响"
    high_risk:
      - "删除数据"
      - "批量更新数据"
      - "修改核心字段含义"
      - "修改数据库结构"
      - "数据迁移"
    medium_risk:
      - "新增字段"
      - "新增表"
      - "修改查询逻辑"
    low_risk:
      - "只读查询调整"
      - "非核心展示字段增加"
  # ------------------------------
  # 系统影响
  # ------------------------------
  system:
    description: "系统运行影响"
    high_risk:
      - "修改定时任务开关"
      - "修改消息队列逻辑"
      - "修改缓存策略"
      - "修改服务调用链"
      - "修改部署配置"
    medium_risk:
      - "新增接口"
      - "修改接口逻辑"
      - "调整系统参数"
    low_risk:
      - "前端样式调整"
      - "静态资源调整"
  # ------------------------------
  # 外部影响
  # ------------------------------
  external:
    description: "外部系统和用户影响"
    high_risk:
      - "第三方接口变更"
      - "开放API变更"
      - "影响外部系统的数据同步"
    medium_risk:
      - "内部接口调整"
    low_risk:
      - "内部展示调整"
# ==================================================
# 强制升级规则
# ==================================================
escalation_rules:
  # 任意命中直接升级L3
  force_L3:
    - "权限模型修改"
    - "支付相关修改"
    - "核心数据删除"
    - "生产环境关键配置修改"
    - "数据库迁移"
    - "安全相关修改"
  # 任意命中至少L2
  minimum_L2:
    - "新增业务模块"
    - "新增接口"
    - "数据库字段变化"
    - "定时任务逻辑变化"
    - "消息流程变化"
    - "跨模块修改"
  # 前端低风险范围
  allow_L0:
    - "按钮颜色修改"
    - "字体调整"
    - "间距调整"
    - "纯展示样式调整"
    - "静态页面文案修改"
# ==================================================
# 判断规则
# ==================================================
evaluation:
  default_level:
    value: "L1"
    description:
      "无法明确判断风险时，默认按照较高风险处理"
  rules:
    - rule: "任意高风险条件命中"
      result: "L3"
    - rule: "任意中风险条件命中"
      result: "L2"
    - rule: "仅低风险条件命中"
      result: "L1"
    - rule: "仅允许L0条件命中"
      result: "L0"
# 建议升级信号：供角色/专项工具检查使用；只能建议提高风险，不能降低 tp-架构设计已判定等级
suggested_escalation_signals:
  principles:
    - "有效风险等级取 tp-架构设计判断与建议等级中较高者"
    - "信号命中后必须记录依据并由 tp-架构设计确认最终风险等级"
  minimum_L2:
    - "跨模块文件修改"
    - "接口契约或调用方修改"
    - "数据库查询或数据脚本修改"
    - "定时任务、消息、缓存或部署文件修改"
  minimum_L3:
    - "权限或认证相关文件修改"
    - "支付、核心状态机或安全相关文件修改"
    - "数据库迁移或生产环境关键配置修改"
# 自动校验信号：保留给 legacy/专项风险扫描兼容使用；V5.2.1 五态 Task 的 Test-TpSpecTask Record-first fast path 不执行旧扫描段。
# pattern 使用 .NET 正则；任何调用者只可据此建议提高风险，不能把扫描结果变成流程状态门禁。
automated_validation:
  scan_sources:
    - "task.md"
    - "implementation.md"
    - "handoff.json:changes"
    - "events.jsonl:SCOPE_CHANGE"
  minimum_L3_signals:
    - id: "PERMISSION"
      pattern: "(修改|新增|调整|变更).*(权限|授权|认证|鉴权)|权限(模型|规则|控制).*(修改|新增|调整|变更)"
    - id: "SENSITIVE_ACCESS_CONTROL"
      pattern: "(仅|只有).*(申请人|流程内|授权|审批|经办).*(查看|访问).*(原始|完整|敏感)|(非流程内|未授权|无权限).*(不下发|不可查看|无权限查看).*(原图|照片|敏感)|不下发.*原图|谁能(看|查看|访问).*(敏感|原始|完整)"
    - id: "SECURITY"
      pattern: "(新增|修改|调整|变更).*(安全策略|加密|脱敏|鉴权)|安全相关修改"
  minimum_L2_signals:
    - id: "DDL"
      pattern: "(?i)\\b(DDL|CREATE\\s+TABLE|ALTER\\s+TABLE|DROP\\s+TABLE|TRUNCATE\\s+TABLE)\\b|数据库(结构|字段|表).*(新增|修改|删除|调整|迁移)"
    - id: "DML"
      pattern: "(?i)\\b(DML|INSERT\\s+INTO|UPDATE\\s+\\w+\\s+SET|DELETE\\s+FROM|MERGE\\s+INTO)\\b|批量(更新|删除|写入)数据"
    - id: "PRODUCTION_DATA"
      pattern: "生产(库|数据).*(修改|写入|删除|修复|迁移)|修改生产数据"
    - id: "EXTERNAL_INTERFACE"
      pattern: "(新增|修改|调整|变更).*(外部接口|第三方接口|开放API)|外部接口.*(新增|修改|调整|变更)"
    - id: "TRANSACTION"
      pattern: "(新增|修改|调整|变更).*(事务|事务边界)|事务(边界|传播).*(新增|修改|调整|变更)"
    - id: "MESSAGE"
      pattern: "(新增|修改|调整|变更).*(消息队列|消息流程|消息消费|消息生产)"
    - id: "SCHEDULED_JOB"
      pattern: "(新增|修改|调整|变更).*(定时任务|调度任务|cron)"
    - id: "BATCH_PROCESSING"
      pattern: "(新增|修改|调整|变更).*(批量处理|批处理)|批量(更新|删除|写入)"
    - id: "HISTORICAL_REPAIR"
      pattern: "(历史数据|存量数据).*(修复|回填|迁移|更正)"
    - id: "IRREVERSIBLE"
      pattern: "不可逆(操作|变更)|无法回滚|永久删除"
  # 否定词与对象间允许可选空白；支持“不涉及/未涉及”；支持“DDL/DML/权限”等并列对象。
  # V5.2.1 单一契约按独立子句（，,。；;、分隔）并按信号局部判断否定。
  negative_pattern: "(不涉及|未涉及|不修改|未修改|不新增|不调整|不变更|不改|无需|没有|无)\\s*(权限|授权|认证|鉴权|生产数据|生产库|数据|外部接口|第三方接口|开放API|外部调用|事务|消息|定时任务|调度任务|批量处理|批处理|历史数据|存量数据|安全|不可逆|回滚|DDL|DML)((\\s*[/、]\\s*|\\s*[和及与]\\s*)(权限|授权|认证|鉴权|生产数据|生产库|数据|外部接口|第三方接口|开放API|外部调用|事务|消息|定时任务|调度任务|批量处理|批处理|历史数据|存量数据|安全|不可逆|回滚|DDL|DML))*"
# ==================================================
# 架构风险评估要求（tp-架构设计）
# ==================================================
architecture_risk_evaluation:
  required_output:
    - "风险等级"
    - "判断依据"
    - "影响范围"
    - "潜在风险"
    - "推荐流程"
  mandatory_questions:
    - "是否影响业务流程?"
    - "是否影响数据?"
    - "是否影响权限?"
    - "是否影响外部系统?"
    - "是否影响定时任务?"
    - "是否需要人工确认?"
# ==================================================
# 特殊原则
# ==================================================
principles:
  code_size_not_equal_risk:
    enabled: true
    description:
      "代码修改量不能作为风险判断依据"
  unknown_risk_upgrade:
    enabled: true
    description:
      "发现未知影响时，必须升级风险等级并重新评估"
  human_override:
    enabled: true
    description:
      "人工负责人可以提高风险等级，但不能降低高风险判断"
