schema: tp-spec.event-semantics-contract/v1
event_schema: tp-spec.event-semantics/v1

controlled:
  result_status:
    - RECORDED
    - STARTED
    - COMPLETED
    - PENDING
    - BLOCKED
    - CANCELLED
    - NOT_RECORDED
  decision:
    - PASS
    - REVISE
    - NEEDS_FIX
    - FAIL
    - ERROR
    - BLOCKED
    - NOT_RECORDED
  operations:
    - CHECKPOINT
    - VERIFY
    - REVIEW
    - START
    - END
    - WORKFLOW_CONFIRM
    - DELIVERY_CONVERGE
    - KNOWLEDGE_REQUEST
    - KNOWLEDGE_CONVERGE
    - SCOPE_CHANGE
    - STATE
    - BLOCK
    - RECORD

event_families:
  FACT:
    checkpoint_required: [operation, phase, result_status]
  VERIFICATION_COMPLETED:
    required: [operation, decision, result_status, change_set_id]
    operation: VERIFY
  REVIEW_COMPLETED:
    required: [operation, review_kind, decision, result_status]
    operation: REVIEW
  WORK_SESSION_STARTED:
    required: [operation, result_status]
    operation: START
  WORK_SESSION_ENDED:
    required: [operation, result_status]
    operation: END
  BLOCKER:
    required: [operation, result_status]
    operation: BLOCK
  WORKFLOW_CONFIRMATION:
    required: [operation, result_status]
    operation: WORKFLOW_CONFIRM
  DELIVERY_RESULT:
    required: [operation, result_status, verification_change_set_id, review_event_id, review_change_set_id, change_set_id]
    operation: DELIVERY_CONVERGE
  KNOWLEDGE_CONVERGENCE_REQUEST:
    required: [operation, result_status, delivery_event_id, verification_event_id, review_event_id, change_set_id, trigger_reason_codes, search_scope, source_refs]
    operation: KNOWLEDGE_REQUEST
  KNOWLEDGE_CONVERGENCE_RESULT:
    required: [operation, result_status, request_event_id, change_set_id, knowledge_disposition, query_receipts, source_refs, source_items, reason_code]
    operation: KNOWLEDGE_CONVERGE
  SCOPE_CHANGE:
    required: [operation, result_status, scope_id]
    operation: SCOPE_CHANGE
