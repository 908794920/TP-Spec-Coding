# V5.2.4 B-12 治理级命令注册表（R3 校验源）
#
# 权威：历史“升级计划-智能验证与上下文治理” §3.2 L137（命令只校验注册表中的
# ID、参数 schema、注册表版本与内容 SHA-256，以及已保存输出证据；绝不执行命令）、
# §7 L311（命令注册表有稳定 schema、版本、content SHA-256）。human_owner 动作级授权
# G1（2026-08-02）创建本文件；cutover（G2）不在授权范围。
#
# 双锚点：registry_version + registry_content_sha256。registry_content_sha256 为
# {"commands": [...]} 经 json.dumps(ensure_ascii=False, sort_keys=True) 规范化序列化后的
# SHA-256（与 cli/structured_refs.py compute_registry_content_sha256 同算法）；重算不一致
# → 校验器 fail-closed 拒绝整个注册表（视为 registry 不可信）。
#
# 每条命令：
#   - id: 命令 ID（唯一；引用 value 与之比对，未知 ID → COMMAND_ID_UNKNOWN）
#   - registry_version: 与顶层一致（不一致 → COMMAND_REGISTRY_VERSION_MISMATCH）
#   - args_schema: 参数名白名单（location "params:k=v" 提取的参数名超出 → COMMAND_ARGS_SCHEMA_MISMATCH）
#   - content_sha256: 命令定义锚点 = {"id","args_schema","output_evidence_required"}
#     规范化序列化后的 SHA-256；引用 evidence_hash 必须与之一致（不一致 → COMMAND_CONTENT_HASH_MISMATCH）
#   - output_evidence_required: true 时引用必须携带 evidence_hash（缺失 → COMMAND_OUTPUT_MISSING）
#
# 首批纳入仅限只读/证据类且不执行外部进程的命令（无 subprocess/网络/模型调用）：
# receipt（B-16 收据）、report 只读报表组、refs-validate（B-12）、lossless-summary（B-14）、
# config 只读子命令。review-preflight 因内部执行 git（cli/review_preflight.py _run_git）
# 属执行外部进程，不纳入。本文件绝不包含可执行命令行。
