version: 5.3.8
mode: record-first
principle: business work first; Runtime owns bookkeeping
daily_api:
  task_create:
    command: tp-spec task create --id <TASK> --project <PROJECT> [--workflow-mode standard|quick] [--risk <L0-L3>] [--flow <L0-L3>] [--mode-source <ACTUAL-USER-INSTRUCTION>] [--mode-source-ref <CONTEXT-REF>] [--agent <ACTUAL-AGENT>] [--scaffold] --db <DB>
    purpose: Create the Task and its lightweight coordination identity in the existing STATE NULL-to-NEW transaction.
    notes:
    - tp-spec.task-coordinator/v1 metadata uses producer task_create; the creation actor remains tp-software-lifecycle and the recorded coordinator defaults to tp-project-manager.
    - Optional agent is a real caller identifier; absent stays empty. No generated main-agent identity, mandatory plan, new phase or physical migration.
    - NOT_RECORDED describes absence of an execution plan; coordinator_source still identifies the actual creation event. Legacy markerless records retain old interpretation.
    - Standard requires real risk/flow grades. Quick requires the actual user choice and reference; grades may remain null. Missing historical workflow_mode means standard, never an inferred quick choice.
  task_mode_select:
    command: tp-spec task mode-select --task <TASK> --task-dir <DIR> --workflow-mode standard|quick --mode-source <ACTUAL-USER-INSTRUCTION> --mode-source-ref <CONTEXT-REF> --request-id <ID> [--actor <ACTUAL-RECORDER>] [--risk <L0-L3>] [--flow <L0-L3>] --db <DB>
    purpose: Append a trusted TASK_MODE_SELECTED to the current Task using existing logical-request replay; never a scope change or implicit completion.
    notes:
    - Current material decisions and real permission waits remain applicable. The instruction source is supplied from the actual user context by the entry point, not authenticated by matching example wording.
  task_checkpoint:
    command: tp-spec task checkpoint --task <TASK> --task-dir <DIR> --actor <ROLE>
      --phase <PHASE> --summary <TEXT> [--evidence evidence/... ] [--request-id <ID>] [--collect <OUTPUT>] [--result-report <REPORT>] [--recorded-result <EVENT-ID>]
    purpose: Record one meaningful progress milestone. NEW auto-activates; projections
      auto-rebuild.
    notes:
    - Do not checkpoint microsteps.
    - Repeat --result-report to receive existing pytest JUnit or TP-Spec Base/Code Review reports as observation-only facts; never execute tests or grant PASS.
    - Reuse a stable --request-id for retries of the same batch. The source report is not authenticated execution, deployment, human acceptance or an independent review.
    - Format/limits, compact result_observations and recovery semantics are documented in docs/agents/tp-software-lifecycle.md.
    - Repeat --recorded-result to preserve original actors/scopes/evidence of trusted same-Task development/verification/CODE events; no re-signing or inferred authority.
    - No handoff/frontmatter/refs payload is required.
    - Natural, evidence-backed Delivery/Knowledge hints may be attached with --knowledge-signal-json / --delivery-signal; never scan just to create signals.
    - Task-bound Context Usage may be attached with --context-usage-json; invalid telemetry is WARN+DROP and never changes the operation result.
  task_run_pytest:
    command: tp-spec task run-pytest --task <TASK> --task-dir <DIR> --test <FILE.py::NODE>
      --authorization-evidence <EXISTING-EVIDENCE> --request-id <RUN-ID> --summary <TEXT>
    purpose: Explicit opt-in selected pytest execution with observed process metadata and automatic evidence intake, not formal PASS.
    notes:
    - Never a mandatory lifecycle step; already completed tests use report intake without rerunning.
    - Caller must have actual approval for selected tests/plugins/effects; the evidence reference is not an authorization grant or sandbox.
    - No arbitrary command, directory-wide selection or additional pytest arguments; current interpreter with cleared addopts. Project plugins still apply.
    - Same request never reruns an already reserved execution. Complete receipts retry only accounting; missing/damaged receipts preserve unknown state.
    - Batch intake can reference already trusted professional results, but cannot sign previously unrecorded independent judgments for other actors.
    - Commands, output, real exit and timing are local observations; no new Verification/Review/human acceptance is produced.
    - See docs/agents/tp-software-lifecycle.md for exit codes, control receipts, raw log privacy and recovery limits.
  task_verify:
    command: tp-spec task verify --task <TASK> --task-dir <DIR> --decision PASS|FAIL|NEEDS_FIX
      --summary <TEXT> [--evidence evidence/... ]
    purpose: Record actual technical verification.
    notes:
    - PASS requires at least one real evidence/* file.
    - PASS is bound to the latest Development change_set_id; product content drift makes the old result stale.
    - Verification is a fact, not a phase-transition gate.
    - Task-bound Context Usage may be attached with --context-usage-json; invalid telemetry is WARN+DROP and never changes the operation result.
  task_block:
    command: tp-spec task block --task <TASK> --task-dir <DIR> --actor <ROLE> --reason
      <TEXT>
    purpose: Record a real unresolved blocker.
  task_resume:
    command: tp-spec task resume --task <TASK> --task-dir <DIR> --actor <ROLE> --summary
      <TEXT> [--phase <PHASE>]
    purpose: Resume work after the explicit blocker is resolved.
  task_complete:
    command: tp-spec task complete --task <TASK> --task-dir <DIR> --summary
      <TEXT>
    purpose: Finish the task and auto-generate final-result with truthful verification
      facts.
    notes:
    - Use the recorded Task coordination responsibility; step participants do not replace the Task coordinator or prove an Agent is online.
    - Every AC must be PASS, NOT_REQUIRED, N/A, DEFERRED_ACCEPTED, or OWNER_WAIVED before completion; PENDING/BLOCKED is rejected.
    - database_operations records each READ/DML/DDL separately; an unexecuted operation must be reconciled through its acceptance refs.
    - If a recorded verification subject changed, final truth is marked *_STALE instead of reusing PASS.
    - Completion commits the real terminal fact and converges status/events/continuation/final-result plus generated/terminal-manifest.json; projection failure is disclosed separately from committed facts.
    - Repeating complete for a terminal Task returns its recorded terminal result without rewriting files, evidence or history. Cancellation is not completion.
  task_complete_check:
    command: tp-spec task complete --task <TASK> --task-dir <DIR> --db <DB> --check
    purpose: Read-only tp-spec.closeout/v1 diagnostics shared with formal complete and the workbench.
    notes:
    - checks reports applicability, issues, facts, responsibility and depends_on; blockers and unknowns are aggregated. Unknown required facts never count as PASS.
    - Covers registered execution/Work/integration, current subject and evidence, AC/Owner/database/visual obligations, effective route, cleanup and Delivery/Knowledge/Memory. It cannot prove unregistered business facts.
    - No event, checkpoint, Change Set, cleanup, test or Knowledge request is created by preflight. Stable facts and applicable results are reused.
    - One SQLite read snapshot does not lock product/evidence files; formal writes recheck their applicable inputs. See docs/agents/tp-software-lifecycle.md.
  workflow_confirm:
    command: tp-spec workflow confirm --task <TASK> --task-dir <DIR> [--user-source <ACTUAL-OWNER-INSTRUCTION>] [--user-source-ref <CONTEXT-REF>] [--request-id <ID>] --db <DB>
    purpose: Audited current material decision or explicit quick completion instruction with actual user source.
    notes:
    - New confirmation_kind is material|completion. Historical ordinary is readable; new each_stage input is retired. Completion requires --user-source, --user-source-ref and --request-id, bound to current delivery, ChangeSet, subject and mode source.
    - A short Wake Prompt is returned only after the bound confirmation is accepted.
  workflow_retire_confirmation_wait:
    command: tp-spec workflow retire-confirmation-wait --task <TASK> --task-dir <DIR> [--actor tp-software-lifecycle] --db <DB> [--json]
    purpose: Resume only the currently bound and trusted historical EACH_STAGE_POLICY ordinary wait, recording policy retirement without fabricating human approval.
    notes:
    - Material, permission, completion and unrelated waits are not retired. Persisted known each_stage preferences read as material with migration metadata; writing material performs the actual migration and preserves unrelated settings.
  task_delivery_converge:
    command: tp-spec task delivery-converge --task <TASK> --task-dir <DIR> --delivery-status READY|BLOCKED --reason <TEXT> ...
    purpose: L0-L3 structured Delivery convergence with current product binding and the professional verification/review results required by the effective route; inapplicable results are NOT_REQUIRED, never synthetic PASS.
    notes:
    - A plain delivery checkpoint never satisfies this contract.
    - Standard READY Delivery emits or reuses a task-input-bound KNOWLEDGE_CONVERGENCE_REQUEST. Quick uses applicable actual checks/disclosures and emits no compulsory Knowledge request; READY remains ACTIVE pending explicit owner completion.
    - A current Request without a trusted Result is routed as dispatch_effect(tp-knowledge); tp-spec.task-learning/v1 checks effective Task/step/Work input coverage, targeted Knowledge handling and Memory assessment.
    - Stable inputs reuse valid Delivery/Request/Result. Changed relevant inputs require reassessment; markerless historical deliveries retain legacy interpretation without fabricating a past assessment or retrofitting terminal Tasks.
    - Task-bound Context Usage may be attached with --context-usage-json; invalid telemetry is WARN+DROP and never changes the operation result.
  task_execution:
    command: tp-spec work plan|show|step|start|update|end --task <TASK> --db <DB> ...
    purpose: Explicit versioned steps and distinct role participations in the existing event ledger; see docs/EXECUTION_FACTS.md for each subcommand.
    notes:
    - Plan registration does not invent completed work. Parent progress stays forward; waiting, child Fix and evidence applicability are separate facts.
    - Coordination comes from trusted creation or an effective plan; actual role participation and next responsibility remain separate. Empty agents are unrecorded, not inferred from the last actor.
    - Expected step participants or the recorded coordinator may complete a step under the existing checks; no PM-only completion permission is added.
    - Versioned future handoffs preserve begun history. Old markerless and terminal Tasks are not backfilled; code rollback cannot erase the semantics of new recorded facts.
    - Role/agent strings, working directory and unfinished participation do not prove identity, hard isolation or liveness.
  work_results:
    command: tp-spec workitem create|claim|complete|receive|candidate|release|retry|list --task <TASK> --db <DB> ...
    purpose: Scoped Work results, exact coordinator receipts and actual integration candidates; see docs/WORK_UNITS.md.
    notes:
    - Professional executors submit results; integration engineers perform authorized apply/conflict resolution and submit their actual outputs. The recorded coordinator (PM by default) receives exact results and records a record-only candidate; small Tasks do not require an extra integration Work.
    - Candidate/receipt permissions still match the recorded coordinator role and known agent; integration expertise alone does not grant those permissions. Candidate binds current code, requirements/AC Subject, exact results/receipts and conflict evidence.
    - New JSON Work specs use tp-spec.work-unit/v1 and one security_context; do not mix legacy CLI scope overrides with --file.
    - rework fix binds the existing parent step and issue identity. Work completion does not complete its parent step/Task or grant merge/push/cleanup authority.
  security_change:
    command: tp-spec task security source|propose|observe|show --task <TASK> --db <DB> ...
    purpose: Evidence and original human attribution are separate from approval. Decisions reuse task scope-change; see docs/security-change-authority.md.
    notes:
    - New out-of-scope observable security changes require explicit human approval of the matching Proposal/scope/version. Discovery, tests, reviews and persisted text cannot grant it.
    - Local source attestation is not host identity authentication; ordinary authorized repairs do not require repeated approval.
project_api:
  project_bootstrap_check: tp-spec project bootstrap --id <PROJECT> --root <ROOT> --check-only
  project_bootstrap: tp-spec project bootstrap --id <PROJECT> --root <ROOT>
  project_upgrade_contract: tp-spec project upgrade-contract --id <PROJECT> --to 5.3.8
errors:
  PROJECT_BOOTSTRAP_AVAILABLE: read-only bootstrap check found a pristine project that may be initialized only after explicit human_owner action
  PROJECT_NOT_INITIALIZED: project ledger is not initialized; run project bootstrap/init first
  PROJECT_BOOTSTRAP_UNSAFE: bootstrap refused because the project is not pristine or ledger state is ambiguous
runtime_owned:
- task identity / contract metadata
- current_state / legacy phase-owner facts / trusted creation or explicit plan coordinator with source event / step-participation projections
- status.yaml / events.jsonl / generated/continuation.md / generated/final-result.md / generated/terminal-manifest.json
- provenance for adopted intake artifacts
- durable journal and SQLite transaction recovery
do_not_use_in_normal_role_flow:
- commit --refresh
- commit --phase-exit
- phase-exit dry-run as a mandatory gate
- hand-authored stage_handoff / intended_next / next_prompt
- refs-validate merely to unlock another phase
- empty optional artifacts created only for validator completeness
optional_capabilities:
  workflow_orchestrator: read-only next-role resolution and contract doctor; it never writes Task state or creates a second ledger
  architecture_review: risk-triggered independent review; not a default development
    gate
  structured_refs: available when precise provenance materially helps; missing refs
    are WARN
  work_sessions: legacy timing remains optional; explicitly bound new-plan participation must end before its adopted step or Work can finish, without implying process liveness
  acceptance_override: human_owner defer/waive without forging PASS
  scope_change: human_owner-only typed scope correction via `task scope-change`; optional repeated --repo-root replaces the complete effective repository set, while omission leaves it unchanged; it rebuilds projections without creating a new Task state or granting execution authority
  terminal_integrity: read-only `task terminal-check` compares terminal artifacts with the completion-time manifest and never reopens history
  knowledge_task_convergence: >-
    Required per-Task assessment after new READY Delivery, not a new lifecycle stage. Read `knowledge task-inputs --task <TASK> --task-dir <DIR> --db <DB>` and the referenced actual inputs, then `knowledge task-converge --task <TASK> --task-dir <DIR> --db <DB> --workspace-root <ROOT> --request-event-id <ID> --assessment <JSON>`.
    Use per-input coverage entries, targeted current-project+shared queries and truthful Knowledge/Memory dispositions; mandatory assessment does not require low-value writes. Stable inputs replay without a duplicate request/result. Legacy --disposition payloads apply only to markerless requests. See agents/tp-knowledge/SKILL.md and skills/capabilities/knowledge-capture/SKILL.md.
  legacy_commit: compatibility/recovery surface; not the daily role API
  context_effectiveness: >-
    Read-only report over Task-bound Context Usage receipts. It never gates workflow
    and never mutates Context assets.
rules:
  write_semantics:
    canonical_writer: Runtime SQLite transaction + durable journal; roles never edit
      SQLite directly
    audited_write_commands:
    - task checkpoint / task verify / task block / task resume / task complete
    - task scope-change
    - workflow confirm / task delivery-converge / task delivery-accept-deferred
    - work plan / work step / work start / work update / work end
    - workitem create / claim / complete / receive / candidate / release / retry
    - rework fix / task security source / propose / observe
    - knowledge task-converge
    - acceptance-override
    - legacy commit (compatibility/recovery only)
    direct_sqlite_edit: forbidden
    projection_write: Runtime-owned; status/events/generated views are rebuilt automatically
  execution_timing:
    pairing_rule: WORK_SESSION_STARTED/ENDED use session_id correlation; runtime/dispatcher
      should own start/end when available
    pretask_rule: No TaskId means no fabricated work-session event; pre-task timing
      may remain unrecorded
    workflow_effect: missing legacy timing does not block; unfinished explicitly adopted participation is work still to reconcile, not permission to infer an active process
  temporary_artifacts:
    storage: system_temp
    ownership: machine-local JSON manifest keyed by project/task/run
    statuses: [ACTIVE, CLEANED, CLEANUP_PENDING]
    not_a_task_state: true
    source_files: immutable; read or copy into owned temp only, never overwrite/move/delete originals
    cleanup: work end cleans the matching registered run; task complete/cancel retries all registered task runs
    crash_recovery: persistent ownership enables explicit interrupted-session close or temp cleanup retry after restart
    orphan_check: report-only for unmanaged/history paths; never delete by name, wildcard, or appearance
    link_safety: never follow symlink, Junction, or reparse-point targets during cleanup
