version: 5.2.1
mode: record-first
principle: business work first; Runtime owns bookkeeping
daily_api:
  task_checkpoint:
    command: tp-spec task checkpoint --task <TASK> --task-dir <DIR> --actor <ROLE>
      --phase <PHASE> --summary <TEXT> [--evidence evidence/... ]
    purpose: Record one meaningful progress milestone. NEW auto-activates; projections
      auto-rebuild.
    notes:
    - Do not checkpoint microsteps.
    - No handoff/frontmatter/refs payload is required.
    - Natural, evidence-backed Delivery/Knowledge hints may be attached with --knowledge-signal-json / --delivery-signal; never scan just to create signals.
    - Task-bound Context Usage may be attached with --context-usage-json; invalid telemetry is WARN+DROP and never changes the operation result.
  task_verify:
    command: tp-spec task verify --task <TASK> --task-dir <DIR> --decision PASS|FAIL|NEEDS_FIX
      --summary <TEXT> [--evidence evidence/... ]
    purpose: Record actual technical verification.
    notes:
    - PASS requires at least one real evidence/* file.
    - Verification is a fact, not a phase-transition gate.
    - Task-bound Context Usage may be attached with --context-usage-json; invalid telemetry is WARN+DROP and never changes the operation result.
  task_block:
    command: tp-spec task block --task <TASK> --task-dir <DIR> --actor <ROLE> --reason
      <TEXT>
    purpose: Record a real unresolved blocker.
  task_resume:
    command: tp-spec task resume --task <TASK> --task-dir <DIR> --actor <ROLE> --summary
      <TEXT> [--phase <PHASE>]
    purpose: Resume work after the explicit blocker is resolved.
  task_complete:
    command: tp-spec task complete --task <TASK> --task-dir <DIR> --summary
      <TEXT>
    purpose: Finish the task and auto-generate final-result with truthful verification
      facts.
    notes:
    - Actor defaults to the latest task owner; do not repeat role identity just for bookkeeping.
    - If a recorded verification subject changed, final truth is marked *_STALE instead of reusing PASS.
  workflow_confirm:
    command: tp-spec workflow confirm --task <TASK> --task-dir <DIR>
    purpose: human_owner-only audited confirmation for the currently bound ordinary(each_stage) or material workflow boundary.
    notes:
    - It records WORKFLOW_CONFIRMATION with confirmation_kind=ordinary|material, bound to source event/digest + target role/stage/mode; it is not a business DECISION.
    - A short Wake Prompt is returned only after the bound confirmation is accepted.
  task_delivery_converge:
    command: tp-spec task delivery-converge --task <TASK> --task-dir <DIR> --knowledge-disposition CREATED|UPDATED|NO_CHANGE|DEFERRED|BLOCKED --reason <TEXT> ...
    purpose: L2/L3 structured Delivery/Knowledge convergence bound to the current Verification PASS.
    notes:
    - A plain delivery checkpoint never satisfies this contract.
    - Runtime executes the targeted current-project+shared search itself; CREATED/UPDATED additionally validate the exact canonical ref/Task evidence/source refs and run exact-canonical lint + incremental exact-ref index update/verify without a full Vault scan.
    - DEFERRED needs a recovery condition and matching human_owner delivery-accept-deferred event; BLOCKED never completes the pipeline.
    - Task-bound Context Usage may be attached with --context-usage-json; Runtime-generated Knowledge search receipts are captured automatically; invalid telemetry is WARN+DROP and never changes the operation result.
project_api:
  project_bootstrap_check: tp-spec project bootstrap --id <PROJECT> --root <ROOT> --check-only
  project_bootstrap: tp-spec project bootstrap --id <PROJECT> --root <ROOT>
  project_upgrade_contract: tp-spec project upgrade-contract --id <PROJECT> --to 5.2.1
errors:
  PROJECT_BOOTSTRAP_AVAILABLE: read-only bootstrap check found a pristine project that may be initialized only after explicit human_owner action
  PROJECT_NOT_INITIALIZED: project ledger is not initialized; run project bootstrap/init first
  PROJECT_BOOTSTRAP_UNSAFE: bootstrap refused because the project is not pristine or ledger state is ambiguous
runtime_owned:
- task identity / contract metadata
- current_state / current_phase / current_owner projection
- status.yaml / events.jsonl / generated/continuation.md / generated/final-result.md
- provenance for adopted intake artifacts
- durable journal and SQLite transaction recovery
do_not_use_in_normal_role_flow:
- commit --refresh
- commit --phase-exit
- phase-exit dry-run as a mandatory gate
- hand-authored stage_handoff / intended_next / next_prompt
- refs-validate merely to unlock another phase
- empty optional artifacts created only for validator completeness
optional_capabilities:
  workflow_orchestrator: read-only next-role resolution and contract doctor; it never writes Task state or creates a second ledger
  architecture_review: risk-triggered independent review; not a default development
    gate
  structured_refs: available when precise provenance materially helps; missing refs
    are WARN
  work_sessions: available for timing evidence; never a workflow blocker
  acceptance_override: human_owner defer/waive without forging PASS
  legacy_commit: compatibility/recovery surface; not the V5.2.1 daily role API
  context_effectiveness: >-
    Read-only report over Task-bound Context Usage receipts. It never gates workflow
    and never mutates Context assets.
rules:
  write_semantics:
    canonical_writer: Runtime SQLite transaction + durable journal; roles never edit
      SQLite directly
    audited_write_commands:
    - task checkpoint / task verify / task block / task resume / task complete
    - workflow confirm / task delivery-converge / task delivery-accept-deferred
    - work start / work end
    - acceptance-override
    - legacy commit (compatibility/recovery only)
    direct_sqlite_edit: forbidden
    projection_write: Runtime-owned; status/events/generated views are rebuilt automatically
  execution_timing:
    pairing_rule: WORK_SESSION_STARTED/ENDED use session_id correlation; runtime/dispatcher
      should own start/end when available
    pretask_rule: No TaskId means no fabricated work-session event; pre-task timing
      may remain unrecorded
    workflow_effect: timing evidence never blocks task progression
